name: Release

# Tag a release to publish it:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets — the same six used by cubbyDB, so one set of
# Apple credentials covers both projects:
#
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password for that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Allen Chang (D9387N6G4C)"
#   APPLE_ID                    Apple account email
#   APPLE_PASSWORD              app-specific password from appleid.apple.com
#   APPLE_TEAM_ID               D9387N6G4C

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm $RUNNER_TEMP/cert.p12

      - name: Build signed disk image
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          make VERSION="${{ steps.version.outputs.value }}" \
               SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" dmg
          # Sign the disk image itself, not just the app inside it — Gatekeeper
          # assesses the container the user actually double-clicks.
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
            "build/Clack-${{ steps.version.outputs.value }}.dmg"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="build/Clack-${{ steps.version.outputs.value }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify Gatekeeper accepts it
        run: |
          DMG="build/Clack-${{ steps.version.outputs.value }}.dmg"
          spctl -a -vvv -t install "$DMG"
          echo "sha=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        id: verify

      # A stable filename so the landing page can link to
      # /releases/latest/download/Clack.dmg without ever being edited.
      - name: Stable alias
        run: cp "build/Clack-${{ steps.version.outputs.value }}.dmg" build/Clack.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Clack-${{ steps.version.outputs.value }}.dmg
            build/Clack.dmg
          generate_release_notes: true
          body: |
            ### Install

            ```
            brew install --cask ay-chang/tap/clack
            ```

            Or download `Clack-${{ steps.version.outputs.value }}.dmg` below.
            Signed with a Developer ID and notarized by Apple.

            `sha256  ${{ steps.verify.outputs.sha }}`
